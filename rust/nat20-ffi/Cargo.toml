[package]
name = "nat20-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0"
description = "C ABI for the nat20 Rust library, for linking into boot firmware."

[lib]
name = "nat20_rust"
crate-type = ["staticlib", "rlib"]

[features]
default = ["panic-loop", "soft-crypto"]
# Crypto backend selection; when both are enabled, mono-crypto wins.
soft-crypto = ["nat20/soft-crypto"]
mono-crypto = ["nat20/mono-crypto"]
# Exactly one panic strategy must be selected for bare-metal builds.
# Host unit tests build without either: --no-default-features --features soft-crypto.
# panic-loop spins and needs nothing from the environment; panic-putc-hang
# prints through putc() and stops in hang(), which U-Boot provides.
panic-loop = []
panic-putc-hang = []

[dependencies]
nat20 = { path = "../nat20" }
