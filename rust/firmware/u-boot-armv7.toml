# Builds the library for linking into U-Boot (SPL or proper) on 32-bit Arm:
#
#     tools/build-firmware-lib.sh u-boot-armv7
#
# This adds to the armv7a-none-eabi defaults in .cargo/config.toml. A
# build system that invokes rustc itself must apply the same flags, and
# compile its crypto backend's C with U-Boot's (-ffixed-r9 among them).

[build]
target = "armv7a-none-eabi"

[target.armv7a-none-eabi]
# U-Boot keeps its global data pointer (gd) in r9 for good and compiles
# all of its C with -ffixed-r9. Rust must not allocate r9 either, or calls
# back into U-Boot (the crypto backend, the panic-putc-hang handler's putc)
# find gd clobbered.
# rustc does not know the feature and says so; LLVM honors it.
rustflags = ["-C", "target-feature=+reserve-r9"]

[unstable]
# U-Boot links position-independent (-pie), which rejects the movw/movt
# absolute relocations in rustup's prebuilt core, so core is rebuilt from
# source (with the flags above). Cargo honors this table only on nightly
# or with RUSTC_BOOTSTRAP=1, which tools/build-firmware-lib.sh sets.
build-std = ["core"]
