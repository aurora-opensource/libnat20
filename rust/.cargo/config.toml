# Defaults for each bare-metal target, independent of the firmware the
# library is linked into. What a particular firmware environment needs on
# top (reserved registers, C ABI details, rebuilt core) is in
# firmware/<environment>-<arch>.toml, passed with cargo --config; see
# tools/build-firmware-lib.sh.

[target.armv7a-none-eabi]
rustflags = [
    "--cfg", "curve25519_dalek_bits=\"32\"",
    "--cfg", "curve25519_dalek_backend=\"serial\"",
    # Compile as Thumb-2: about 15-20% less .text with unchanged
    # constant-time properties (re-verified by disassembly; see SIZE.md).
    # thumb-mode/thumb2 are rustc-known but unstable-to-specify features,
    # hence the build warning; behavior is locked by rust-toolchain.toml —
    # re-verify size and the CT spot-check when bumping the toolchain.
    # The precompiled core/compiler_builtins stay ARM-mode; the linker
    # handles interworking.
    "-C", "target-feature=+thumb-mode,+thumb2",
    # Deliberately no target-cpu: target-cpu=cortex-a7 would enable
    # NEON/VFPv4 codegen, which early boot firmware must avoid. +hwdiv is also
    # deliberately absent: it is unknown to rustc, which breaks inlining
    # against prebuilt core (+2 KB), and the library performs no runtime
    # division anyway.
]
