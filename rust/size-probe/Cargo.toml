[package]
name = "size-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0"
description = "Minimal bare-metal binary linking the nat20 FFI, used to track code size."

[[bin]]
name = "size-probe"
path = "src/main.rs"

[features]
# Measure the Monocypher-backed configuration:
# cargo build -p size-probe --no-default-features --features mono-crypto ...
default = ["soft-crypto"]
soft-crypto = ["nat20-ffi/soft-crypto"]
mono-crypto = ["nat20-ffi/mono-crypto"]

[dependencies]
nat20-ffi = { path = "../nat20-ffi", default-features = false, features = ["panic-loop"] }
