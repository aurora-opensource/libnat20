name: rust-build-and-test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  rust-lint:
    name: Rust format, lint and docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b #v4.1.5
      # The toolchain is pinned by rust/rust-toolchain.toml.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy -p nat20 --all-targets -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps -p nat20

  rust-test:
    name: Rust test (${{ matrix.options.name }})
    strategy:
      matrix:
        options:
          [
            { name: "nat20, no backend", args: "-p nat20" },
          ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b #v4.1.5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Test
        run: cargo test ${{ matrix.options.args }}

