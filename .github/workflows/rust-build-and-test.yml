name: rust-build-and-test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  rust-lint:
    name: Rust format, lint and docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b #v4.1.5
      # The toolchain is pinned by rust/rust-toolchain.toml.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy -p nat20 --features soft-crypto --all-targets -- -D warnings
          cargo clippy -p nat20 --features soft-crypto,mono-crypto --all-targets -- -D warnings
          cargo clippy -p nat20-ffi --tests --no-default-features --features soft-crypto -- -D warnings
          cargo clippy -p nat20-ffi --tests --no-default-features --features mono-crypto,soft-crypto -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps -p nat20 --features soft-crypto,mono-crypto
          cargo doc --no-deps -p nat20-ffi --no-default-features --features mono-crypto,soft-crypto

  rust-test:
    name: Rust test (${{ matrix.options.name }})
    strategy:
      matrix:
        options:
          [
            { name: "nat20, soft-crypto", args: "-p nat20 --features soft-crypto" },
            { name: "nat20, mono-crypto", args: "-p nat20 --features soft-crypto,mono-crypto" },
            { name: "nat20-ffi, soft-crypto", args: "-p nat20-ffi --lib --no-default-features --features soft-crypto" },
            { name: "nat20-ffi, mono-crypto", args: "-p nat20-ffi --lib --no-default-features --features mono-crypto,soft-crypto" },
          ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b #v4.1.5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Test
        run: cargo test ${{ matrix.options.args }}

  rust-firmware:
    name: Rust firmware build and size budget
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b #v4.1.5
      - name: Install the pinned toolchain and the Arm cross compiler
        run: |
          rustup toolchain install
          rustup component add rust-src
          sudo apt update
          sudo apt install gcc-arm-none-eabi -y
      - name: Build the static library
        run: |
          cargo build --release --target armv7a-none-eabi -p nat20-ffi
          cargo build --release --target armv7a-none-eabi -p nat20-ffi \
            --no-default-features --features mono-crypto,panic-loop
      - name: Build the static library for each firmware profile
        run: |
          for config in firmware/*.toml; do
            profile=$(basename "$config" .toml)
            tools/build-firmware-lib.sh "$profile"
            SLIM=1 tools/build-firmware-lib.sh "$profile"
          done
      - name: Check the code size budget (SIZE.md)
        run: |
          for features in "" "--no-default-features --features mono-crypto"; do
            cargo build --release --target armv7a-none-eabi -p size-probe $features
            text=$(arm-none-eabi-size target/armv7a-none-eabi/release/size-probe | awk 'NR == 2 { print $1 }')
            echo "size-probe ${features:-(soft-crypto)}: ${text} B .text"
            test "$text" -le 40000
          done

  rust-stack-probe:
    name: Rust stack scrub check (QEMU, ${{ matrix.profile || 'target defaults' }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Empty: the target defaults alone.
        profile: ["", "u-boot-armv7"]
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b #v4.1.5
      - name: Install the pinned toolchain, the Arm cross compiler and QEMU
        run: |
          rustup toolchain install
          rustup component add rust-src
          sudo apt update
          sudo apt install gcc-arm-none-eabi qemu-system-arm -y
      - name: Run the stack probe
        run: tools/stack-probe.sh ${{ matrix.profile }}
