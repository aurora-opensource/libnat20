name: rust-test-coverage-report

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  pull-requests: write

jobs:
  rust-test-coverage-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b #v4.1.5
      - name: Install the pinned toolchain
        working-directory: rust
        # rust/rust-toolchain.toml pins the version and adds llvm-tools.
        run: rustup toolchain install
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 #v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install lcov
        run: |
          sudo apt update
          sudo apt install lcov -y
      - name: Test with coverage
        working-directory: rust
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report -p nat20 --features soft-crypto,mono-crypto
          cargo llvm-cov --no-report -p nat20-ffi --lib --no-default-features --features soft-crypto
          cargo llvm-cov --no-report -p nat20-ffi --lib --no-default-features --features mono-crypto,soft-crypto
          cargo llvm-cov report --lcov --output-path lcov.info \
            --ignore-filename-regex '(/tests/|_tests\.rs$|/third_party/)'
          # Paths relative to the repository root, as the report expects.
          sed -i "s|^SF:${GITHUB_WORKSPACE}/|SF:|" lcov.info
      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@eda775f552bfb2bffbdedea26f19dfb8c24a1648 #v4.1.26
        with:
          coverage-files: "rust/lcov.info"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: "Rust LCov Test Coverage Report"
          title-prefix: "Rust"
          update-comment: true
